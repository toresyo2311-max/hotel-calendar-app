<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>⑧ 외항사 마일리지 — 폭 검증 하네스</title>
<style>
  html,body{margin:0;background:#eeecf6;font:12px/1.5 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}
  iframe{border:0;background:#fff;display:block}
  #out{position:fixed;left:8px;bottom:8px;max-width:520px;background:#fff;border:1px solid #bbb;border-radius:8px;padding:8px 10px;font-size:11.5px;white-space:pre-wrap;z-index:9}
</style>
</head>
<body>
<iframe id="m" aria-hidden="true" tabindex="-1" title="검증 프레임"></iframe>
<pre id="out">측정 중…</pre>
<script>
var q=new URLSearchParams(location.search);
var W=+(q.get('w')||390), H=+(q.get('h')||844);
var f=document.getElementById('m'),out=document.getElementById('out');
f.style.width=W+'px'; f.style.height=H+'px';
f.src='./index.html?r=pm'+W+'&diag=1#tab=partner-mileage';
function measure(){
  try{
    var w=f.contentWindow,d=w.document,de=d.documentElement;
    var panel=d.getElementById('pmPanel');
    if(panel)w.scrollTo(0,panel.getBoundingClientRect().top+w.scrollY-56);
    setTimeout(function(){
      var w2=f.contentWindow,d2=w2.document,de2=d2.documentElement;
      out.textContent=W+'×'+H+' 프레임 — 안쪽 뷰포트 '+w2.innerWidth+'×'+w2.innerHeight
        +'\n문서 scrollWidth '+de2.scrollWidth+' / clientWidth '+de2.clientWidth
        +'\n가로 넘침 '+Math.max(0,de2.scrollWidth-de2.clientWidth)+'px'
        +'\nJS 오류 '+((w2.__ERRS||[]).length)+'건'
        +(((w2.__ERRS||[]).length)?'\n  '+w2.__ERRS.join('\n  '):'')
        +'\n카드 '+d2.querySelectorAll('#pmList article').length+'장 · 도시 칩 '+d2.querySelectorAll('[data-pm-dest]').length+'개';
    },900);
  }catch(e){out.textContent='측정 실패: '+e}
}
f.addEventListener('load',measure);
setTimeout(measure,2600);
</script>
</body>
</html>
