<!doctype html>
<html><head><meta charset="utf-8"><title>harness</title>
<style>
 body{margin:0;background:#111;font:12px system-ui;color:#ddd}
 .row{display:flex;gap:14px;align-items:flex-start;padding:10px;flex-wrap:wrap}
 figure{margin:0}
 figcaption{font:11px monospace;padding:4px 0}
 iframe{border:0;background:#fff;display:block}
</style></head>
<body>
<div class="row">
  <figure><figcaption>390x844</figcaption><iframe id="f390" src="index.html" width="390" height="844"></iframe></figure>
  <figure><figcaption>360x800</figcaption><iframe id="f360" src="index.html" width="360" height="800"></iframe></figure>
  <figure><figcaption>1440x900</figcaption><iframe id="f1440" src="index.html" width="1440" height="900"></iframe></figure>
</div>
<script>
function hush(w){
  try{
    var d=w.document;
    if(!d||!d.head||d.getElementById('hush'))return;
    var s=d.createElement('style');s.id='hush';
    s.textContent='.page{display:none!important}#dataLoading,.alertbar{display:none!important}';
    d.head.appendChild(s);
  }catch(e){}
}
function measure(id){
  var f=document.getElementById(id),w=f.contentWindow,d=w.document;
  var q=function(s){return d.querySelector(s)};
  var r=function(e){var b=e.getBoundingClientRect();return [Math.round(b.x),Math.round(b.y),Math.round(b.width),Math.round(b.height)]};
  var tn=q('.tabs');
  var tabs=[].slice.call(d.querySelectorAll('.tab')).map(function(t){
    return t.innerText.replace(/\s+/g,' ').trim()+'|'+r(t).join(',')+(t.scrollWidth>t.clientWidth+1?'|OVF':'');
  });
  return id+': cw='+d.documentElement.clientWidth+' sw='+d.documentElement.scrollWidth+' bsw='+d.body.scrollWidth
    +' disp='+(tn?w.getComputedStyle(tn).display:'-')+' tabs='+(tn?r(tn).join(','):'-')
    +' lock='+(q('#lockAgain')?r(q('#lockAgain')).join(','):'-')
    +' brand='+(q('.brand')?r(q('.brand')).join(','):'-')
    +' met='+(q('.topbar-metrics')?r(q('.topbar-metrics')).join(','):'-')
    +' rows='+Array.from(new Set([].slice.call(d.querySelectorAll('.tab')).map(function(t){return Math.round(t.getBoundingClientRect().y)}))).length
    +' :: '+tabs.join(' ; ');
}
function run(){
  ['f390','f360','f1440'].forEach(function(id){hush(document.getElementById(id).contentWindow)});
  setTimeout(function(){
    var t=measure('f390')+' || '+measure('f360')+' || '+measure('f1440');
    document.title='M '+t.slice(0,900);
    var p=document.createElement('pre');p.id='ooo';p.textContent=t;document.body.appendChild(p);
  },1200);
}
['f390','f360','f1440'].forEach(function(id){document.getElementById(id).addEventListener('load',function(){setTimeout(run,1500)})});
setInterval(function(){['f390','f360','f1440'].forEach(function(id){hush(document.getElementById(id).contentWindow)})},1500);
</script>
</body></html>
