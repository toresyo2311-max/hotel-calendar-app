<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>⑧ 외항사 마일리지 — 390×844 검증 하네스</title>
<style>
  body{margin:0;background:#eeecf6;font:12px/1.5 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;padding:10px}
  .row{display:flex;gap:12px;align-items:flex-start}
  iframe{width:390px;height:844px;border:1px solid #bbb;background:#fff;border-radius:8px}
  pre{margin:0;background:#fff;border:1px solid #ccc;border-radius:8px;padding:10px;font-size:12px;white-space:pre-wrap;max-width:640px}
</style>
</head>
<body>
<div class="row">
  <iframe id="m" src="./index.html?r=pm390&diag=1#tab=partner-mileage" title="390×844"></iframe>
  <pre id="out">측정 중…</pre>
</div>
<script>
var f=document.getElementById('m'),out=document.getElementById('out');
function measure(){
  try{
    var w=f.contentWindow,d=w.document,de=d.documentElement;
    var panel=d.getElementById('pmPanel');
    if(panel&&panel.scrollIntoView)w.scrollTo(0,panel.getBoundingClientRect().top+w.scrollY-64);
    setTimeout(function(){
      var de2=f.contentWindow.document.documentElement;
      var widest=0,who='';
      f.contentWindow.document.querySelectorAll('#pmPanel *').forEach(function(el){
        var r=el.getBoundingClientRect();
        if(r.right>widest){widest=Math.round(r.right);who=el.className&&el.className.toString?el.className.toString().slice(0,40):el.tagName}
      });
      out.textContent='뷰포트 '+f.contentWindow.innerWidth+'×'+f.contentWindow.innerHeight
        +'\n문서 scrollWidth '+de2.scrollWidth+' / clientWidth '+de2.clientWidth
        +'\n가로 넘침 '+Math.max(0,de2.scrollWidth-de2.clientWidth)+'px'
        +'\n가장 오른쪽 요소 right '+widest+' ('+who+')'
        +'\nJS 오류 '+((f.contentWindow.__ERRS||[]).length)+'건'
        +(((f.contentWindow.__ERRS||[]).length)?'\n  '+f.contentWindow.__ERRS.join('\n  '):'')
        +'\n카드 '+f.contentWindow.document.querySelectorAll('#pmList article').length+'장 · 도시 칩 '+f.contentWindow.document.querySelectorAll('[data-pm-dest]').length+'개';
    },700);
  }catch(e){out.textContent='측정 실패: '+e}
}
f.addEventListener('load',measure);
setTimeout(measure,2500);
</script>
</body>
</html>
