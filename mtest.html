<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<title>⑦ 마일리지 검증 하네스</title>
<style>
html,body{margin:0;background:#dfe3ea;font:12px/1.5 system-ui,sans-serif}
#wrap{padding:10px}
#f{border:0;background:#fff;display:block;box-shadow:0 2px 10px rgba(0,0,0,.18)}
#r{padding:8px;font:11px/1.5 monospace;white-space:pre-wrap;color:#111;max-width:1400px}
</style></head><body>
<div id="wrap" aria-hidden="true"><iframe id="f" title="검증 화면" tabindex="-1"></iframe></div><div id="r">측정 중…</div>
<script>
var q=new URLSearchParams(location.search);
var W=Number(q.get('w')||390), H=Number(q.get('h')||844);
var route=(q.get('route')||'').toUpperCase(), month=q.get('month')||'', dir=q.get('dir'), view=q.get('view')||'cal';
var f=document.getElementById('f'), r=document.getElementById('r');
f.style.width=W+'px'; f.style.height=H+'px';
f.src='./?diag=1#tab=mileage';

function click(el){ if(!el)return false; el.click(); return true; }
function setSel(el,v){ if(!el)return false; el.value=String(v); el.dispatchEvent(new Event('change',{bubbles:true})); return true; }

function measure(tag){
  try{
    var d=f.contentDocument, w=f.contentWindow, de=d.documentElement;
    var panel=d.getElementById('mgPanel');
    var vw=w.innerWidth, over=[], strip=0;
    ['#mgPanel','#mgRoutes','#mgKpi','#mgCal','#mgRoundList','#mgBanner'].forEach(function(sel){
      var root=d.querySelector(sel); if(!root)return;
      root.querySelectorAll('*').forEach(function(el){
        var b=el.getBoundingClientRect();
        if(b.width>0&&(b.right>vw+1||b.left<-1)){
          if(el.closest&&el.closest('.mg-routes')){strip++;return;}   /* 노선 칩 줄은 가로 스크롤 영역 — 정상 */
          over.push(sel+':'+(el.id||el.className||el.tagName)+'@'+Math.round(b.left)+'..'+Math.round(b.right));
        }
      });
    });
    var cells=[].slice.call(d.querySelectorAll('#mgCalBody .mg-cell'));
    var counts={};
    cells.forEach(function(c){var k=c.className.replace('mg-cell','').trim()||'blank';counts[k]=(counts[k]||0)+1;});
    var out={
      tag:tag, innerW:vw, innerH:w.innerHeight, scrollW:de.scrollWidth, clientW:de.clientWidth,
      chipStripOverflow:strip,
      errs:(w.__ERRS||[]).slice(0,5),
      month:(d.getElementById('mgMon')||{}).textContent,
      route:(d.querySelector('#mgRoutes button[pressed]')||{}).textContent,
      view:(d.querySelector('#mgViews button[aria-selected="true"]')||{}).textContent,
      chipsBadges:{no:(d.querySelectorAll('#mgRoutes .mg-tag.no')||[]).length,sum:(d.querySelectorAll('#mgRoutes .mg-tag.sum')||[]).length},
      cellCounts:counts,
      kpi:d.getElementById('mgKpi').innerText.replace(/\n/g,' | '),
      note:(d.getElementById('mgCalNote')||{}).innerText,
      round:(d.getElementById('mgRoundCount')||{}).textContent,
      overflow:over.slice(0,6), overCount:over.length
    };
    r.textContent=JSON.stringify(out,null,1);
    document.title='W'+de.scrollWidth+'/'+vw+' E'+out.errs.length+' O'+out.overCount+' '+tag;
  }catch(e){ r.textContent='ERR '+e.message }
}

f.addEventListener('load',function(){
  setTimeout(function(){
    try{
      var d=f.contentDocument, w=f.contentWindow;
      var steps=[];
      if(view!=='cal'){ click(d.querySelector('[data-mg-view="'+view+'"]')); steps.push('view:'+view); }
      if(route){ click(d.querySelector('#mgRoutes [data-mg-route="'+route+'"]')); steps.push('route:'+route); }
      if(dir!=null){ setSel(d.getElementById('mgDir'),dir); steps.push('dir:'+dir); }
      if(month){
        var list=(w.mgMonths&&w.mgMonths())||[];
        var i=list.indexOf(month), n=0;
        while(i>0&&n<13){ click(d.getElementById('mgNext')); i--; n++; }
        steps.push('month:'+month+'('+n+'회 이동)');
      }
      w.scrollTo&&w.scrollTo(0,0);
      setTimeout(function(){ measure(steps.join(' · ')||'default'); }, 700);
    }catch(e){ r.textContent='ERR2 '+e.message }
  }, 2200);
});
</script>
</body></html>
