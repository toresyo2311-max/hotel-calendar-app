<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>390 검증(임시)</title>
<style>html,body{margin:0;background:#0d0a13;color:#fff;font:13px/1.4 -apple-system,sans-serif}
#wrap{display:flex;gap:14px;padding:10px}#box{width:390px;height:844px;border:1px solid #555;overflow:hidden}
iframe{width:390px;height:844px;border:0;display:block}#out{padding-top:8px;max-width:420px;white-space:pre-wrap}</style>
<div id="wrap"><div><div id="box"><iframe id="fr" src="https://toresyo2311-max.github.io/hotel-calendar-app/?diag=1#tab=marriott&city=%ED%83%80%EC%9D%B4%EC%A4%91"></iframe></div></div>
<div id="out">측정 중…</div></div>
<script>
var fr=document.getElementById('fr'),out=document.getElementById('out');
function measure(){
  try{
    var d=fr.contentDocument,w=fr.contentWindow;
    out.textContent='iframe viewport width = '+w.innerWidth+'px\n'+
      'documentElement.scrollWidth = '+d.documentElement.scrollWidth+'px\n'+
      'body.scrollWidth = '+d.body.scrollWidth+'px\n'+
      '가로 넘침 = '+Math.max(0,d.documentElement.scrollWidth-w.innerWidth)+'px\n'+
      '__ERRS = '+((w.__ERRS||[]).length)+'건\n'+
      '배지 = '+(d.querySelector('.tab.active b')?d.querySelector('[data-tab=marriott] b').textContent:'-')+'\n'+
      '도시 옵션 = '+(d.querySelectorAll('select')[0]?d.querySelectorAll('select')[0].options[d.querySelectorAll('select')[0].selectedIndex].text:'-');
  }catch(e){out.textContent='ERR '+e.message;}
}
fr.addEventListener('load',function(){setTimeout(measure,2500);});
setTimeout(measure,4000);
</script>
</html>
