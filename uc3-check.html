<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>3단계 검증</title>
<style>body{margin:0;font-family:monospace;background:#1b122b;color:#eee}#wrap{display:flex;gap:8px}#f{width:1180px;height:900px;border:0;background:#fff}#out{margin:0;padding:8px;font-size:11px;white-space:pre-wrap;max-width:560px}</style>
</head><body>
<div id="wrap">
  <iframe id="f" src="uc3-preview.html?v=4" title="app"></iframe>
  <pre id="out">RUNNING</pre>
</div>
<script>
const out = document.getElementById('out');
const R = [];
const log = (step, obj) => { R.push(Object.assign({step}, obj)); out.textContent = JSON.stringify(R, null, 1); };
const f = document.getElementById('f');
const sleep = ms => new Promise(r => setTimeout(r, ms));
let fw, ev, q;
async function waitFor(exp, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 30000)) {
    try { if (ev(exp)) return true; } catch (e) {}
    await sleep(250);
  }
  return false;
}
async function attach() {
  fw = f.contentWindow; ev = c => fw.eval(c); q = s => fw.document.querySelector(s);
  fw.__errs = [];
  fw.addEventListener('error', e => fw.__errs.push('error:' + (e.message || '')));
  fw.addEventListener('unhandledrejection', e => fw.__errs.push('rej:' + String(e.reason)));
  const ce = fw.console.error.bind(fw.console);
  fw.console.error = (...a) => { fw.__errs.push('console:' + a.map(String).join(' ')); ce(...a); };
}
function phase() { return Number(window.__phase || 0); }
const QUICK = location.search.indexOf('quick') >= 0;

f.addEventListener('load', async () => {
  await attach();
  try {
    if (QUICK) { await waitFor("DATA_READY.lux && document.querySelectorAll('#hotelList .hotel-row').length>100", 25000); await quick(); out.textContent = JSON.stringify(R, null, 1); window.__done = true; return; }
    if (phase() === 0) {
      // 저장소를 비우고 다시 시작한다(같은 도메인에 남은 이전 시험값 제거)
      ev("localStorage.clear()");
      window.__phase = 1;
      f.contentWindow.location.reload();
      return;
    }
    if (phase() === 1) {
      await waitFor("DATA_READY.lux && document.querySelectorAll('#hotelList .hotel-row').length>100", 25000);
      window.__phase = 2;
      await suite();
      // 저장 유지 확인을 위해 새로 고침 후 phase 2 로
      f.contentWindow.location.reload();
      return;
    }
    // phase 2 — 새로 고침 뒤 저장 유지 확인
    await waitFor("DATA_READY.lux && document.querySelectorAll('#hotelList .hotel-row').length>100", 25000);
    log('2c.persist', {ok: ev("favHas('hotels','h01')"), label: q('#favHotelOnly').textContent,
      starred: ev("document.querySelectorAll('#hotelList .hotel-row.fav').length"),
      stored: ev("localStorage.getItem('teambusan.fav.v1')")});
    // 마지막 화면: 콤보 ⑥ (스크린샷용)
    ev("setTab('combo')"); await sleep(500);
    ev("document.querySelector('[data-cbsrc=\"t\"]').click()"); await sleep(1500);
    ev("window.scrollTo(0,0)");
    log('11.errors', {errs: fw.__errs.slice(0, 12), errCount: fw.__errs.length,
      final: q('#cbCount').textContent});
    out.textContent = JSON.stringify(R, null, 1);
    window.__done = true;
  } catch (e) {
    log('EXCEPTION', {msg: String(e), errs: (fw.__errs || []).slice(0, 8)});
    out.textContent = JSON.stringify(R, null, 1);
    window.__done = true;
  }
});

async function quick() {
  f.style.width = '390px';
  const res = {};
  for (const t of ['lux', 'china', 'domestic', 'marriott', 'flight', 'tt', 'combo']) {
    ev("setTab('" + t + "')");
    await waitFor("st.tab==='" + t + "'", 8000); await sleep(900);
    res[t] = ev("(()=>{const d=document.documentElement,bw=d.clientWidth;const over=[...document.querySelectorAll('body *')].filter(el=>{const r=el.getBoundingClientRect();return r.width>0&&r.right>bw+1&&!el.closest('.tabs')&&!el.closest('.fl-matrix-scroll')}).slice(0,3).map(el=>String(el.className).slice(0,26)||el.tagName);return {sw:d.scrollWidth,cw:bw,over}})()");
  }
  log('Q1.mobile390', res);
  f.style.width = '1180px';
  ev("setTab('marriott')"); await sleep(700);
  ev("switchPmode('points')"); await sleep(700);
  log('Q2.points', {legend: ev("getComputedStyle(document.getElementById('dealLegend')).display"),
    budget: ev("getComputedStyle(document.getElementById('budgetCtl')).display")});
  ev("switchPmode('both')"); await sleep(500);
  ev("setTab('combo')"); await sleep(600);
  ev("document.querySelector('[data-cbsrc=\"t\"]').click()"); await sleep(1500);
  ev("(()=>{const s=document.getElementById('cbTtCity');s.value='KIX';s.dispatchEvent(new Event('change'))})()"); await sleep(1200);
  log('Q3.ttHotelLink', {count: q('#cbCount').textContent,
    links: ev("[...document.querySelectorAll('#cbTop .cb-links a')].map(a=>a.textContent).slice(0,6)"),
    wx: ev("document.querySelectorAll('#cbTop .cb-wx').length")});
  ev("(()=>{const s=document.getElementById('cbTtCity');s.value='all';s.dispatchEvent(new Event('change'))})()"); await sleep(1000);
  ev("window.scrollTo(0,0)");
  log('Q4.errors', {errs: fw.__errs.slice(0, 10), errCount: fw.__errs.length});
}

async function suite() {
  // 1) 첫 화면
  log('1.boot', {ok: true, hotels: ev('allHotels.length'), stars: ev("document.querySelectorAll('[data-fav]').length"),
    dealCells: ev("document.querySelectorAll('.cal-day.deal').length"),
    dealLegend: ev("getComputedStyle(document.getElementById('dealLegend')).display"),
    budgetBtns: ev("document.querySelectorAll('#budgetCtl [data-budget]').length")});

  // 2) 별 → 필터
  const hid = ev("document.querySelector('#hotelList .hotel-row [data-hotel]').getAttribute('data-hotel')");
  q('#hotelList .hotel-row .fav-btn').click(); await sleep(350);
  log('2.favStar', {ok: ev("favHas('hotels','" + hid + "')"), id: hid, label: q('#favHotelOnly').textContent,
    stored: ev("localStorage.getItem('teambusan.fav.v1')"),
    starOn: ev("document.querySelector('#hotelList .hotel-row .fav-btn').classList.contains('on')")});
  q('#favHotelOnly').click(); await sleep(450);
  log('2b.favFilter', {ok: ev("filteredHotels().length===1"),
    hotels: ev('filteredHotels().length'), selectOpts: ev("document.getElementById('hotelSelect').options.length"),
    label: q('#favHotelOnly').textContent});
  q('#favHotelOnly').click(); await sleep(400);

  // 3) 예산 필터
  q('#budgetCtl [data-budget="150000"]').click(); await sleep(600);
  log('3.budget15', {hotels: ev('filteredHotels().length'),
    allUnder: ev("filteredHotels().every(h=>{const b=minPerHotel(h);return b&&b[1]<=150000})"),
    overbudgetCells: ev("document.querySelectorAll('.cal-day.overbudget').length"),
    selected: ev("document.querySelector('#budgetCtl [data-budget=\"150000\"]').classList.contains('selected')")});
  q('#budgetCtl [data-budget="0"]').click(); await sleep(400);

  // 4) ⑤ 권역 필터 + 노선 즐겨찾기
  q('[data-tab="flight"]').click();
  await waitFor("DATA_READY.flight && FLIGHTS.routes.length===47", 40000); await sleep(600);
  log('4.flight', {ok: true, routeOpts: ev("document.getElementById('flRoute').options.length"),
    top5: ev("document.querySelectorAll('#flTop5 .rank-item').length"),
    regionLabels: ev("[...document.querySelectorAll('#flRegion [data-fl-region]')].map(b=>b.textContent)")});
  q('#flRegion [data-fl-region="중국"]').click(); await sleep(700);
  log('4b.region', {matrixRows: ev("document.querySelectorAll('#flMatrix tbody tr').length"),
    routeOpts: ev("document.getElementById('flRoute').options.length"),
    top5: ev("document.querySelectorAll('#flTop5 .rank-item').length"),
    countText: q('#flCount').textContent, calSub: q('#flCalSub').textContent.slice(0, 70)});
  const code = ev("document.querySelector('#flMatrix tbody tr .fav-btn').getAttribute('data-fav')");
  const rc = String(code).split(':')[1];
  ev("document.querySelector('#flMatrix tbody tr .fav-btn').click()"); await sleep(450);
  log('4c.routeFav', {code: code, label: q('#favRouteOnly').textContent, hasRoute: ev("favHas('routes','" + rc + "')")});
  q('#favRouteOnly').click(); await sleep(600);
  log('4d.routeFavFilter', {rows: ev("document.querySelectorAll('#flMatrix tbody tr').length"),
    top5: ev("document.querySelectorAll('#flTop5 .rank-item').length"), label: q('#favRouteOnly').textContent});
  q('#flRegion [data-fl-region="all"]').click(); await sleep(400);
  q('#favRouteOnly').click(); await sleep(400);

  // 5) ④ 1P TOP10
  q('[data-tab="marriott"]').click();
  await waitFor("DATA_READY.marriott", 30000); await sleep(800);
  log('5.ptTop', {hidden: ev("document.getElementById('ptTopBox').hidden"),
    items: ev("document.querySelectorAll('#ptTop10 .pt-item').length"),
    first: ev("(()=>{const b=document.querySelector('#ptTop10 .pt-item');return {t:b.textContent,id:b.getAttribute('data-pt-hotel'),d:b.getAttribute('data-pt-date')}})()"),
    sub: q('#ptTopSub').textContent, order: ev("[...document.querySelectorAll('#ptTop10 .pt-val')].slice(0,4).map(x=>x.textContent)")});
  ev("document.querySelector('#ptTop10 .pt-item').click()"); await sleep(800);
  log('5b.ptJump', {hotel: ev('st.hotel'), city: ev('st.city'), month: ev('st.month'), selDay: ev('st.selectedDay'),
    title: q('#monthTitle').textContent, cur: ev("document.getElementById('mo-'+st.month).classList.contains('cur')"),
    selectionInfo: q('#selectionInfo').textContent.slice(0, 40)});
  ev("switchPmode('points')"); await sleep(700);
  log('5d.pointsMode', {budgetDisplay: ev("getComputedStyle(document.getElementById('budgetCtl')).display"),
    dealCells: ev("document.querySelectorAll('.cal-day.deal').length"), legend: ev("getComputedStyle(document.getElementById('dealLegend')).display")});
  ev("switchPmode('both')"); await sleep(500);

  // 6) 콤보 ⑤
  q('[data-tab="combo"]').click();
  await waitFor("!document.getElementById('comboPanel').hidden && document.querySelectorAll('#cbTop .rank-item').length>0", 30000);
  await sleep(500);
  log('6.combo5', {count: q('#cbCount').textContent, sub: q('#cbSub').textContent.slice(0, 100),
    rows: ev("document.querySelectorAll('#cbTop .rank-item').length"),
    tags: ev("document.querySelectorAll('#cbTop .cb-tag').length"),
    link: ev("document.querySelector('#cbTop .cb-links a').textContent"),
    srcPressed: ev("document.querySelector('#cbSrc [aria-pressed=\"true\"]').textContent"),
    ttFilterHidden: ev("getComputedStyle(document.getElementById('cbTtCityWrap')).display"),
    ccOpts: ev("document.getElementById('cbCity').options.length")});

  // 7) 콤보 ⑥ (⑥ JSON 지연 로딩)
  ev("document.querySelector('[data-cbsrc=\"t\"]').click()");
  const tok = await waitFor("DATA_READY.tt && document.querySelectorAll('#cbTop .rank-item').length>0 && document.querySelector('#cbTop .cb-tag')", 45000);
  await sleep(700);
  log('7.combo6', {ok: tok, count: q('#cbCount').textContent, sub: q('#cbSub').textContent.slice(0, 120),
    firstRow: ev("document.querySelector('#cbTop .rank-name').textContent"),
    firstMeta: ev("document.querySelector('#cbTop .rank-meta').textContent"),
    airText: ev("document.querySelector('#cbTop .cb-links a').textContent"),
    airHost: ev("document.querySelector('#cbTop .cb-links a').href").slice(0, 45),
    hasWx: ev("Boolean(document.querySelector('#cbTop .cb-wx'))"),
    hotelLinkAnywhere: ev("[...document.querySelectorAll('#cbTop .cb-links a')].map(a=>a.textContent).filter(t=>t.indexOf('호텔')>=0).length"),
    ttCityOpts: ev("document.getElementById('cbTtCity').options.length"),
    ttMonthOpts: ev("document.getElementById('cbTtMonth').options.length"),
    ttFilters: ev("getComputedStyle(document.getElementById('cbTtCityWrap')).display"),
    fiveFilters: ev("getComputedStyle(document.querySelector('.cb-fl')).display")});

  // 7b) ⑥ 도시·월 좁히기
  ev("(()=>{const s=document.getElementById('cbTtCity');s.value='KIX';s.dispatchEvent(new Event('change'))})()"); await sleep(900);
  const kix = q('#cbCount').textContent;
  ev("(()=>{const s=document.getElementById('cbTtMonth');s.value='2027-02';s.dispatchEvent(new Event('change'))})()"); await sleep(900);
  log('7b.combo6filter', {city: kix, cityAndMonth: q('#cbCount').textContent, sub: q('#cbSub').textContent.slice(0, 100)});
  ev("(()=>{const s=document.getElementById('cbTtCity');s.value='all';s.dispatchEvent(new Event('change'))})()");
  ev("(()=>{const s=document.getElementById('cbTtMonth');s.value='all';s.dispatchEvent(new Event('change'))})()"); await sleep(900);

  // 8) 통합
  ev("document.querySelector('[data-cbsrc=\"all\"]').click()"); await sleep(1500);
  log('8.comboAll', {count: q('#cbCount').textContent,
    topTags: ev("[...new Set([...document.querySelectorAll('#cbTop .cb-tag')].map(x=>x.textContent))]"),
    cardTags: ev("[...new Set([...document.querySelectorAll('#cbCities .cb-tag')].map(x=>x.textContent))]"),
    cardCount: ev("document.querySelectorAll('#cbCities .cb-city').length"),
    bothFilters: ev("getComputedStyle(document.querySelector('.cb-fl')).display+'/'+getComputedStyle(document.getElementById('cbTtCityWrap')).display")});
  // 도시 카드(⑥) 눌러 좁히기
  ev("(document.querySelector('#cbCities [data-cb-src=\"t\"]')||document.querySelector('#cbCities .cb-city')).click()"); await sleep(900);
  log('8b.cardClick', {count: q('#cbCount').textContent, sub: q('#cbSub').textContent.slice(0, 100)});

  // 9) ⑥ 탭
  q('[data-tab="tt"]').click();
  await waitFor("document.querySelectorAll('#ttTop5 .tt-hit').length>0", 30000); await sleep(500);
  log('9.tt', {top: ev("document.querySelectorAll('#ttTop5 .tt-hit').length"),
    kpi: q('#ttKpi').textContent.slice(0, 40), days: ev("document.querySelectorAll('#ttDays .tt-day').length")});

  // 10) 390px 가로 넘침
  f.style.width = '390px';
  const mob = {};
  for (const t of ['lux', 'china', 'domestic', 'marriott', 'flight', 'tt', 'combo']) {
    ev("setTab('" + t + "')");
    await waitFor("st.tab==='" + t + "'", 8000); await sleep(1300);
    mob[t] = ev("(()=>{const d=document.documentElement;const bw=d.clientWidth;const bad=[...document.querySelectorAll('body *')].filter(el=>{const r=el.getBoundingClientRect();return r.width>0&&r.right>bw+1&&!el.closest('.tabs')&&!el.closest('.fl-matrix-scroll')}).slice(0,3).map(el=>String(el.className).slice(0,30)||el.tagName);return {sw:d.scrollWidth,cw:bw,bad}})()");
  }
  log('10.mobile390', mob);
  f.style.width = '1180px';

  log('10b.backToDesktop', {sw: ev("document.documentElement.scrollWidth"), cw: ev("document.documentElement.clientWidth")});
}
</script>
</body></html>
