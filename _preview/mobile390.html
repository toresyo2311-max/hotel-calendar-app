<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>390 프리뷰 — TEAM-부산</title>
<style>
  html,body{margin:0;padding:0;background:#e9e6f2;font:12px/1.4 -apple-system,system-ui,"Malgun Gothic",sans-serif;color:#4a3a63}
  .bar{padding:6px 8px;background:#fff;border-bottom:1px solid #ddd;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .bar b{font-size:11px}
  .bar button{font:inherit;font-size:11px;padding:3px 8px;border:1px solid #cbbfe6;border-radius:6px;background:#f6f2ff;color:#5b21b6;cursor:pointer}
  #out{font-size:10.5px;color:#5b21b6;white-space:pre-wrap}
  #frame{width:390px;height:844px;border:0;display:block;background:#fff;margin:8px auto;box-shadow:0 2px 14px rgba(60,30,110,.18)}
</style>
</head>
<body>
<div class="bar">
  <b>390 × 844 프리뷰</b>
  <button type="button" id="btnOpen">펼치기/접기</button>
  <button type="button" id="btnMeasure">넘침 측정</button>
  <span id="out">—</span>
</div>
<iframe id="frame" src="../index.html?preview=390" title="TEAM-부산 390px 프리뷰"></iframe>
<script>
(function(){
  var fr=document.getElementById('frame'),out=document.getElementById('out');
  function w(){return fr.contentWindow}
  fr.addEventListener('load',function(){
    try{var win=w();win.__errs=[];win.addEventListener('error',function(e){win.__errs.push(String(e.message))});}catch(e){}
  });
  document.getElementById('btnOpen').addEventListener('click',function(){
    try{var b=w().document.getElementById('hotelFoldBtn');if(b)b.click();measure();}catch(e){out.textContent='err: '+e}
  });
  function measure(){
    try{
      var win=w(),d=win.document;
      var de=d.documentElement;
      var side=d.getElementById('hotelSide'),items=d.getElementById('hotelList');
      out.textContent='iw='+win.innerWidth
        +' · doc scrollW='+de.scrollWidth+' / clientW='+de.clientWidth
        +' · 넘침='+Math.max(0,de.scrollWidth-de.clientWidth)+'px'
        +' · side scrollW='+side.scrollWidth+'/'+side.clientWidth
        +' · items scrollW='+items.scrollWidth+'/'+items.clientWidth
        +' · open='+side.classList.contains('open')
        +' · 행='+items.querySelectorAll('.hotel-choice').length
        +' · cur='+(d.getElementById('hotelCurrent')||{}).textContent
        +' · errs='+(win.__errs?win.__errs.length:'?');
    }catch(e){out.textContent='measure err: '+e}
  }
  document.getElementById('btnMeasure').addEventListener('click',measure);
  setTimeout(measure,900);
})();
</script>
</body>
</html>
