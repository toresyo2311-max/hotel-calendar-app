<!doctype html>
<html><head><meta charset="utf-8"><title>layout harness</title>
<style>
 body{margin:0;background:#111;font:12px system-ui;color:#ddd}
 .row{display:flex;gap:14px;align-items:flex-start;padding:10px;flex-wrap:wrap}
 figure{margin:0}
 figcaption{font:11px monospace;padding:4px 0}
 iframe{border:0;background:#fff;display:block}
 pre{white-space:pre-wrap;font:10px/1.35 monospace;color:#9f9;background:#000;padding:8px;margin:0;max-width:100%}
</style></head>
<body>
<div class="row" aria-hidden="true">
  <figure><figcaption>390×844</figcaption><iframe id="f390" src="index.html" width="390" height="844"></iframe></figure>
  <figure><figcaption>360×800</figcaption><iframe id="f360" src="index.html" width="360" height="800"></iframe></figure>
  <figure><figcaption>1440×900</figcaption><iframe id="f1440" src="index.html" width="1440" height="900"></iframe></figure>
</div>
<pre id="out">measuring…</pre>
<script>
function m(id){
  const f=document.getElementById(id), w=f.contentWindow, d=w.document;
  const q=s=>d.querySelector(s), r=e=>{const b=e.getBoundingClientRect();return [Math.round(b.x),Math.round(b.y),Math.round(b.width),Math.round(b.height)]};
  const tabs=[...d.querySelectorAll('.tab')].map(t=>[t.innerText.replace(/\s+/g,' ').trim(),...r(t),t.scrollWidth>t.clientWidth+1?'OVF':'']);
  const g=e=>e?r(e):null;
  return {id, clientW:d.documentElement.clientWidth, docSW:d.documentElement.scrollWidth, bodySW:d.body.scrollWidth,
    disp:q('.tabs')?w.getComputedStyle(q('.tabs')).display:null, tbox:g(q('.tabs')), tsw:q('.tabs')?q('.tabs').scrollWidth:null, tcw:q('.tabs')?q('.tabs').clientWidth:null,
    rows:[...new Set(tabs.map(t=>t[2]))].length, lock:g(q('#lockAgain')), brand:g(q('.brand')), met:g(q('.topbar-metrics')), hdrH:g(q('.topbar'))?r(q('.topbar'))[3]:null, tabs};
}
const done=()=>{document.getElementById('out').textContent=JSON.stringify(['f390','f360','f1440'].map(m))};
let n=0;['f390','f360','f1440'].forEach(id=>{const f=document.getElementById(id);f.addEventListener('load',()=>{if(++n===3)setTimeout(done,2500)})});
</script>
</body></html>
