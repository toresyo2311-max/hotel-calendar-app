  <section id="pmPanel" class="pm-panel" hidden aria-label="⑧ 외항사 마일 — 부산(PUS)·인천(ICN) 출발 9개 프로그램 보너스 좌석">

          <option value="p">프리미엄 이코노미</option>
          <option value="b">비즈니스</option>
          <option value="f">퍼스트</option>

        <select id="pmSort" aria-label="정렬">

        </select>
      </div>
      <div class="pm-line" id="pmAlliance" role="group" aria-label="동맹 선택"></div>
      <div class="pm-line pm-scroll" id="pmProgs" role="group" aria-label="프로그램 선택"></div>

      <p class="pm-vhint">달력의 날짜 칸을 누르면 그 날의 프로그램별·등급별 필요 마일과 공식 발권 링크가 열립니다.</p>
    </div>

    <div class="pm-block" id="pmCal"></div>
    <div class="pm-block" id="pmList"></div>

    <p class="pm-note" id="pmNote"></p>
