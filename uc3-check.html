<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>3단계 검증</title>
<style>body{margin:0;font-family:monospace;background:#1b122b;color:#eee}#wrap{display:flex;gap:8px}#f{width:1180px;height:900px;border:0;background:#fff}#out{margin:0;padding:8px;font-size:11px;white-space:pre-wrap;max-width:600px}</style>
</head><body>
<div id="wrap">
  <iframe id="f" src="uc3-preview.html?v=3" title="app"></iframe>
  <pre id="out">RUNNING</pre>
</div>
<script>
const out = document.getElementById('out');
const R = [];
const log = (step, obj) => { R.push(Object.assign({step}, obj)); out.textContent = JSON.stringify(R, null, 1); };
const f = document.getElementById('f');
const sleep = ms => new Promise(r => setTimeout(r, ms));
let fw, ev, q;
async function waitFor(exp, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 30000)) {
    try { if (ev(exp)) return true; } catch (e) {}
    await sleep(250);
  }
  return false;
}
f.addEventListener('load', async () => {
  fw = f.contentWindow; ev = c => fw.eval(c); q = s => fw.document.querySelector(s);
  // 오류 수집은 첫 렌더 뒤에 붙는다(로드 시점 오류는 화면으로 확인)
  fw.__errs = [];
  fw.addEventListener('error', e => fw.__errs.push('error:' + (e.message || '')));
  fw.addEventListener('unhandledrejection', e => fw.__errs.push('rej:' + String(e.reason)));
  const ce = fw.console.error.bind(fw.console);
  fw.console.error = (...a) => { fw.__errs.push('console:' + a.map(String).join(' ')); ce(...a); };
  try {
    // 1) 첫 화면
    const boot = await waitFor("DATA_READY.lux && document.querySelectorAll('#hotelList .hotel-row').length>100", 25000);
    log('1.boot', {ok: boot, hotels: ev('allHotels.length'), stars: ev("document.querySelectorAll('[data-fav]').length"),
      dealCells: ev("document.querySelectorAll('.cal-day.deal').length"),
      dealLegend: ev("getComputedStyle(document.getElementById('dealLegend')).display"),
      budgetBtns: ev("document.querySelectorAll('#budgetCtl [data-budget]').length")});

    // 2) 즐겨찾기 별 → 필터
    const hid = ev("document.querySelector('#hotelList .hotel-row [data-hotel]').getAttribute('data-hotel')");
    q('#hotelList .hotel-row .fav-btn').click(); await sleep(300);
    log('2.favStar', {ok: ev("favHas('hotels','"+hid+"')"), id: hid, label: q('#favHotelOnly').textContent,
      stored: ev("localStorage.getItem('teambusan.fav.v1')"), starOn: ev("document.querySelector('#hotelList .hotel-row .fav-btn').classList.contains('on')")});
    q('#favHotelOnly').click(); await sleep(400);
    log('2b.favFilter', {ok: ev('filteredHotels().length===1'), hotels: ev('filteredHotels().length'),
      selectOpts: ev("document.getElementById('hotelSelect').options.length"),
      label: q('#favHotelOnly').textContent, pressed: q('#favHotelOnly').getAttribute('aria-pressed')});
    q('#favHotelOnly').click(); await sleep(400);

    // 2c) 새로 고침해도 저장 유지
    f.contentWindow.location.reload();
    await sleep(3500); await waitFor("DATA_READY.lux && document.querySelectorAll('#hotelList .hotel-row').length>100", 25000);
    log('2c.persist', {ok: ev("favHas('hotels','"+hid+"')"), label: q('#favHotelOnly').textContent,
      starred: ev("document.querySelectorAll('#hotelList .hotel-row.fav').length")});

    // 3) 예산 필터
    q('#budgetCtl [data-budget="150000"]').click(); await sleep(500);
    log('3.budget15', {hotels: ev('filteredHotels().length'), allUnder: ev("filteredHotels().every(h=>{const b=minPerHotel(h);return b&&b[1]<=150000})"),
      overbudgetCells: ev("document.querySelectorAll('.cal-day.overbudget').length"),
      pressed: q('#budgetCtl [data-budget="150000"]').getAttribute('class')});
    q('#budgetCtl [data-budget="0"]').click(); await sleep(400);

    // 4) ⑤ 권역 필터
    q('[data-tab="flight"]').click();
    const flok = await waitFor("DATA_READY.flight && FLIGHTS.routes.length===47", 40000);
    await sleep(500);
    log('4.flight', {ok: flok, routeOpts: ev("document.getElementById('flRoute').options.length"),
      top5: ev("document.querySelectorAll('#flTop5 .rank-item').length"),
      regionLabels: ev("[...document.querySelectorAll('#flRegion [data-fl-region]')].map(b=>b.textContent)")});
    q('#flRegion [data-fl-region="중국"]').click(); await sleep(600);
    log('4b.region', {matrixRows: ev("document.querySelectorAll('#flMatrix tbody tr').length"),
      routeOpts: ev("document.getElementById('flRoute').options.length"),
      top5: ev("document.querySelectorAll('#flTop5 .rank-item').length"),
      countText: q('#flCount').textContent, calSub: q('#flCalSub').textContent.slice(0, 60)});

    // 4c) 노선 즐겨찾기
    const code = ev("document.querySelector('#flMatrix tbody tr .fav-btn').getAttribute('data-fav')");
    ev("document.querySelector('#flMatrix tbody tr .fav-btn').click()"); await sleep(400);
    log('4c.routeFav', {code: code, label: q('#favRouteOnly').textContent, hasRoute: ev("favHas('routes','" + String(code).split(':')[1] + "')")});
    q('#favRouteOnly').click(); await sleep(500);
    log('4d.routeFavFilter', {rows: ev("document.querySelectorAll('#flMatrix tbody tr').length"), label: q('#favRouteOnly').textContent});
    q('#flRegion [data-fl-region="all"]').click(); await sleep(400);
    q('#favRouteOnly').click(); await sleep(400);

    // 5) ④ 1P TOP10
    q('[data-tab="marriott"]').click();
    const mok = await waitFor("DATA_READY.marriott", 30000); await sleep(700);
    const first = ev("(()=>{const b=document.querySelector('#ptTop10 .pt-item');return b?{t:b.textContent,id:b.getAttribute('data-pt-hotel'),d:b.getAttribute('data-pt-date')}:null})()");
    log('5.ptTop', {ok: mok, hidden: ev("document.getElementById('ptTopBox').hidden"),
      items: ev("document.querySelectorAll('#ptTop10 .pt-item').length"), first: first,
      sub: q('#ptTopSub').textContent});
    ev("document.querySelector('#ptTop10 .pt-item').click()"); await sleep(700);
    log('5b.ptJump', {hotel: ev('st.hotel'), month: ev('st.month'), selDay: ev('st.selectedDay'),
      title: q('#monthTitle').textContent, curMonth: ev("document.getElementById('mo-'+st.month).classList.contains('cur')")});
    log('5c.marriottPoints', {pmodeCash: ev("document.querySelectorAll('.cal-day.deal').length")});
    ev("switchPmode('points')"); await sleep(500);
    log('5d.pointsMode', {budgetHidden: ev("getComputedStyle(document.getElementById('budgetCtl')).display"),
      dealCells: ev("document.querySelectorAll('.cal-day.deal').length")});
    ev("switchPmode('both')"); await sleep(300);

    // 6) ✈️+🏨 콤보 — ⑤
    q('[data-tab="combo"]').click();
    const cok = await waitFor("DATA_READY.flight && !document.getElementById('comboPanel').hidden && document.querySelectorAll('#cbTop .rank-item').length>0", 30000);
    log('6.combo5', {ok: cok, count: q('#cbCount').textContent, sub: q('#cbSub').textContent.slice(0, 90),
      rows: ev("document.querySelectorAll('#cbTop .rank-item').length"),
      tagNone: ev("document.querySelectorAll('#cbTop .cb-tag').length"),
      linkText: ev("document.querySelector('#cbTop .cb-links a').textContent")});

    // 7) 콤보 — ⑥ (지연 로딩)
    ev("document.querySelector('[data-cbsrc=\"t\"]').click()");
    const tok = await waitFor("DATA_READY.tt && document.querySelectorAll('#cbTop .rank-item').length>0", 45000);
    await sleep(600);
    log('7.combo6', {ok: tok, count: q('#cbCount').textContent, sub: q('#cbSub').textContent.slice(0, 110),
      tag: ev("document.querySelector('#cbTop .cb-tag')?document.querySelector('#cbTop .cb-tag').textContent:'none'"),
      firstRow: ev("document.querySelector('#cbTop .rank-name').textContent"),
      firstMeta: ev("document.querySelector('#cbTop .rank-meta').textContent"),
      airLink: ev("document.querySelector('#cbTop .cb-links a').getAttribute('href').slice(0,60)"),
      airText: ev("document.querySelector('#cbTop .cb-links a').textContent"),
      hotelLink: ev("(document.querySelectorAll('#cbTop .cb-links a')[1]||{textContent:'없음'}).textContent"),
      ttCityOpts: ev("document.getElementById('cbTtCity').options.length"),
      ttMonthOpts: ev("document.getElementById('cbTtMonth').options.length"),
      showTtFilters: ev("getComputedStyle(document.getElementById('cbTtCityWrap')).display"),
      hideF5: ev("getComputedStyle(document.querySelector('.cb-fl')).display")});

    // 7b) ⑥ 도시 좁히기
    ev("(()=>{const s=document.getElementById('cbTtCity');s.value='KIX';s.dispatchEvent(new Event('change'))})()"); await sleep(800);
    log('7b.combo6city', {count: q('#cbCount').textContent, sub: q('#cbSub').textContent.slice(0, 90),
      rows: ev("document.querySelectorAll('#cbTop .rank-item').length")});

    // 8) 통합
    ev("document.querySelector('[data-cbsrc=\"all\"]').click()"); await sleep(1200);
    log('8.comboAll', {count: q('#cbCount').textContent,
      tags: ev("[...new Set([...document.querySelectorAll('#cbTop .cb-tag')].map(x=>x.textContent))]"),
      cardTags: ev("document.querySelectorAll('#cbCities .cb-tag').length"),
      bothFilters: ev("getComputedStyle(document.querySelector('.cb-fl')).display+'/'+getComputedStyle(document.getElementById('cbTtCityWrap')).display")});

    // 9) ⑥ 땡처리 탭 자체
    q('[data-tab="tt"]').click();
    await waitFor("DATA_READY.tt && document.querySelectorAll('#ttTop5 .tt-hit').length>0", 30000); await sleep(500);
    log('9.tt', {top: ev("document.querySelectorAll('#ttTop5 .tt-hit').length"), kpi: q('#ttKpi').textContent.slice(0, 60)});

    // 10) 모바일 가로 넘침
    f.style.width = '390px';
    const mob = {};
    for (const t of ['lux', 'china', 'domestic', 'marriott', 'flight', 'tt', 'combo']) {
      ev("setTab('" + t + "')");
      await waitFor("true", 500); await sleep(900);
      mob[t] = ev("(()=>{const d=document.documentElement;const over=[...document.querySelectorAll('body *')].filter(el=>{const r=el.getBoundingClientRect();return r.width>0&&r.right>d.clientWidth+1}).slice(0,3).map(el=>el.className||el.tagName);return {sw:d.scrollWidth,cw:d.clientWidth,over}})()");
    }
    log('10.mobile390', mob);
    f.style.width = '1180px';

    // 마지막 화면: 콤보 ⑥ (스크린샷용)
    ev("setTab('combo')"); await sleep(400);
    ev("document.querySelector('[data-cbsrc=\"t\"]').click()"); await sleep(900);
    ev("window.scrollTo(0,0)"); 
    log('11.done', {errs: fw.__errs.slice(0, 12), errCount: fw.__errs.length});
  } catch (e) {
    log('EXCEPTION', {msg: String(e), errs: (fw.__errs || []).slice(0, 8)});
  }
  out.textContent = JSON.stringify(R, null, 1);
  window.__done = true;
});
</script>
</body></html>
