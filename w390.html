<!doctype html>
<html lang="ko"><meta charset="utf-8" name="viewport" content="width=device-width,initial-scale=1"><title>390 검증(임시)</title>
<style>html,body{margin:0;background:#0d0a13;color:#fff;font:13px/1.4 -apple-system,sans-serif}
#wrap{display:flex;gap:14px;padding:10px;align-items:flex-start}
.box{width:390px;height:844px;border:1px solid #555;overflow:hidden}
iframe{width:390px;height:844px;border:0;display:block}
#out{padding:8px 10px;max-width:430px;white-space:pre-wrap;line-height:1.5}</style>
<div id="wrap">
  <div class="box"><iframe id="fr1" src="https://toresyo2311-max.github.io/hotel-calendar-app/?diag=1#tab=marriott&city=%ED%83%80%EC%9D%B4%EC%A4%91&hotel=m308"></iframe></div>
  <div class="box"><iframe id="fr2" src="https://toresyo2311-max.github.io/hotel-calendar-app/?diag=1#tab=marriott"></iframe></div>
  <div id="out">측정 중…</div>
</div>
<script>
function m(id){
  var fr=document.getElementById(id), d=fr.contentDocument, w=fr.contentWindow;
  var over=Math.max(0,d.documentElement.scrollWidth-w.innerWidth);
  var bad=[].slice.call(d.querySelectorAll('body *')).filter(function(e){
    var r=e.getBoundingClientRect(); return r.width>0 && r.right>w.innerWidth+0.5;
  }).slice(0,4).map(function(e){return e.tagName+'.'+(e.className||'').toString().slice(0,24);});
  return id+': viewport='+w.innerWidth+'px scrollWidth='+d.documentElement.scrollWidth+'px 넘침='+over+'px'
    +' __ERRS='+((w.__ERRS||[]).length)+' 배지='+(d.querySelector('[data-tab=marriott] b')||{}).textContent
    +(bad.length?' 넘친요소='+bad.join(','):'');
}
function measure(){
  var t=[];
  ['fr1','fr2'].forEach(function(id){ try{t.push(m(id));}catch(e){t.push(id+' ERR '+e.message);} });
  document.getElementById('out').textContent=t.join('\n');
}
['fr1','fr2'].forEach(function(id){
  document.getElementById(id).addEventListener('load',function(){setTimeout(measure,3000);});
});
setTimeout(measure,4500); setTimeout(measure,7000);
</script>
</html>
