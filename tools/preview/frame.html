<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>레이아웃 확인 프레임 — 1280 · 390</title>
<!-- 앱 화면을 폭 1280(데스크톱)과 390(폰)에서 나란히 띄워 눈과 캡처로 확인하는 개발용 프레임(앱 화면에는 링크하지 않는다).
     index.html 을 iframe 으로 불러오므로 미디어 쿼리는 iframe 폭 기준으로 그대로 적용된다.
     ?tab=flight  탭 지정 · ?y=1600&m=1200  처음 스크롤 위치 · 위 버튼은 각 프레임을 700px씩 내리고 올린다. -->
<style>
  html,body{margin:0;background:#d9d5e4;height:100%;overflow:hidden}
  #bar{height:34px;display:flex;align-items:center;gap:6px;padding:0 10px;background:#241739;color:#e8e2ff;font:11px/1 -apple-system,sans-serif}
  #bar b{font-weight:700;letter-spacing:.02em;margin-right:4px}
  #bar button{border:1px solid rgba(199,182,251,.4);background:rgba(124,58,237,.25);color:#efeaff;border-radius:6px;padding:3px 9px;font:inherit;cursor:pointer}
  #bar button:hover{background:rgba(124,58,237,.45)}
  #stage{position:relative;height:calc(100% - 34px);display:flex;gap:12px;padding:6px 8px;box-sizing:border-box}
  iframe{border:0;background:#fff;box-shadow:0 2px 12px rgba(20,10,36,.18);flex:none}
</style>
<div id="bar"><b>레이아웃 확인</b>
  <button type="button" data-roll="d|-700">데스크톱 ▲</button>
  <button type="button" data-roll="d|700">데스크톱 ▼</button>
  <button type="button" data-roll="m|-700">모바일 ▲</button>
  <button type="button" data-roll="m|700">모바일 ▼</button>
</div>
<div id="stage">
  <iframe id="d" width="1280" height="900" title="desktop 1280"></iframe>
  <iframe id="m" width="390" height="844" title="mobile 390"></iframe>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var tab = q.get('tab') || 'lux';
  var d = document.getElementById('d'), m = document.getElementById('m');
  d.src = '../../index.html#tab=' + tab;
  m.src = '../../index.html#tab=' + tab;
  d.onload = function () { if (q.get('y')) d.contentWindow.scrollTo(0, +q.get('y')); };
  m.onload = function () { if (q.get('m')) m.contentWindow.scrollTo(0, +q.get('m')); };
  document.getElementById('bar').addEventListener('click', function (e) {
    var b = e.target.closest('[data-roll]'); if (!b) return;
    var p = b.dataset.roll.split('|');
    var w = (p[0] === 'd' ? d : m).contentWindow;
    w.scrollBy(0, +p[1]);
  });
</script>
</html>
